name: Run Momentum Screen

on:
  repository_dispatch:
    types: [run_screen]
  schedule:
    # Primary: 11:00 UTC = 16:30 IST, Mon-Fri
    - cron: '0 11 * * 1-5'
    # Backup: 13:30 UTC = 19:00 IST, Mon-Fri
    # GitHub's free-tier scheduler can be hours late or skip entirely.
    # The screener is idempotent (upserts by run_date) so running twice is safe.
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance supabase pandas numpy requests

      - name: Run screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCREEN_PARAMS: ${{ toJson(github.event.client_payload.params) }}
        run: python screener.py

      - name: Compute rank velocity
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python rank_velocity.py

      - name: Record portfolio snapshots
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python portfolio_snapshot.py
