name: Run Momentum Screen

on:
  repository_dispatch:
    types: [run_screen]
  schedule:
    # 11:00 UTC = 16:30 IST, Mon-Fri. NSE closes 15:30 IST; +1h buffer covers
    # candle settling and GitHub Actions scheduling delays. Does NOT skip NSE holidays.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance supabase pandas numpy requests

      - name: Run screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCREEN_PARAMS: ${{ toJson(github.event.client_payload.params) }}
        run: python screener.py

      - name: Compute rank velocity
        # Independent add-on: reads the last N runs (incl. the one just pushed)
        # and refreshes the rank_momentum table. Never fails the screen.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python rank_velocity.py
