name: Run Momentum Screen

on:
  repository_dispatch:
    types: [run_screen]
  schedule:
    # Primary: 11:17 UTC = 16:47 IST — non-round minute reduces GitHub queue collision
    - cron: '17 11 * * 1-5'
    # Backup 1: 12:37 UTC = 18:07 IST
    - cron: '37 12 * * 1-5'
    # Backup 2: 13:47 UTC = 19:17 IST
    - cron: '47 13 * * 1-5'
    # The screener is idempotent (upserts by run_date) so running multiple times is safe.
    # Keepalive workflow provides an additional safety net at 14:00 UTC.
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance supabase pandas numpy requests

      - name: Run screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCREEN_PARAMS: ${{ toJson(github.event.client_payload.params) }}
        run: python screener.py

      - name: Compute rank velocity
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python rank_velocity.py

      - name: Record portfolio snapshots
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python portfolio_snapshot.py
