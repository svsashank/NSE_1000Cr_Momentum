name: Run Momentum Screen

on:
  repository_dispatch:
    types: [run_screen]
  schedule:
    # All times shifted to give Yahoo Finance 3+ hours after NSE close (15:30 IST)
    # to confirm day's candles before we fetch. Running too soon returns stale prices.
    #
    # Primary: 12:47 UTC = 18:17 IST (2h47m after NSE close)
    - cron: '47 12 * * 1-5'
    # Backup 1: 13:37 UTC = 19:07 IST
    - cron: '37 13 * * 1-5'
    # Backup 2: 14:27 UTC = 19:57 IST
    - cron: '27 14 * * 1-5'
    # Screener is idempotent (upserts by run_date) so running multiple times is safe.
    # Keepalive workflow provides an additional safety net at 15:00 UTC.
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance supabase pandas numpy requests

      - name: Run screener
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCREEN_PARAMS: ${{ toJson(github.event.client_payload.params) }}
        run: python screener.py

      - name: Compute rank velocity
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python rank_velocity.py

      - name: Record portfolio snapshots
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python portfolio_snapshot.py
